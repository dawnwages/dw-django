[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dawnwagesinfo"
version = "0.1.0"
description = "Project description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aurora-dsql-python-connector==0.2.7",
    "aurora_dsql_django==0.6.0",
    "boto3==1.43.101",
    "dj-database-url==3.1.2",
    "Django==6.1.1",
    "django-colorful==1.4.0",
    "django-el-pagination==4.1.2",
    "django-social-share==2.3.0",
    "django-storages==1.14.6",
    "gunicorn==26.2.0",
    "pillow-heif==1.8.0",
    "psycopg2-binary==2.9.13",
    # Fork of puput that allows Wagtail 7/8 (branch wagtail-8 on dawnwages/puput).
    "puput @ https://github.com/dawnwages/puput/archive/09fb0c4ae70d6df693a31f88526e48ed87fab7d3.zip",
    "python-dotenv==1.2.3",
    "wagtail==8.0",
    "wagtail-markdown==0.15.0",
    "wagtail-modeladmin==2.4.0",
    "wagtailmenus==4.1",
    "whitenoise==6.12.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dawnwagesinfo", "home", "search", "common", "portfolio"]
namespaces = false
