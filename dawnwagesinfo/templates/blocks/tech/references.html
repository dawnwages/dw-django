<section class="dw-refs" aria-label="{{ value.heading }}">
  <h2 class="dw-refs__title">{{ value.heading }}</h2>
  <ol class="dw-refs__list">
    {% for ref in value.items %}
      <li><a href="{{ ref.url }}">{{ ref.title }}</a>{% if ref.note %} <span class="dw-refs__note">{{ ref.note }}</span>{% endif %}</li>
    {% endfor %}
  </ol>
</section>
