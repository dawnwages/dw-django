{% load wagtailimages_tags %}

<figure class="block-person-quote">
    <div class="row">
        <div class="col-sm-4 col-lg-3">{% image value.image fill-600x600-c50 %}</div>
        <div class="col-sm-8 col-lg-9">
            <blockquote>
                <p>{{ value.quote|safe }}</p>
                <figcaption>&mdash;{{ value.byline }}</figcaption>
            </blockquote>
        </div>
    </div>
</figure>
